[project]
name = "tf3-localization-zh-hk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chungchungdev", email = "chungchung.dev@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "click>=8.5.0",
    "loguru>=0.7.3",
    "polib>=1.2.0",
    "rich>=15.0.0",
]

[project.scripts]
tf3-localization-zh-hk = "tf3_localization_zh_hk:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
python-preference = "only-managed"
